{% load elixir_toolkit_tags %}

<div class="filter-system" id="filter-system-{{ identifier }}">
    <div class="buttons filter-group">

        <!-- Bouton reset global -->
        <button
            class="button is-rounded is-primary filter-btn"
            data-filter=""
            data-group="all"
            aria-pressed="true">
            Tout
        </button>

        {% if is_multi %}
            {% for sub_filters in filters %}
                {% for val, label in sub_filters %}
                    <button
                        class="button is-rounded is-primary-light filter-btn"
                        data-filter="{{ val }}"
                        data-group="{{ forloop.parentloop.counter0 }}"
                        aria-pressed="false">
                        {{ label }}
                    </button>
                {% endfor %}
            {% endfor %}
        {% else %}
            {% for val, label in filters %}
                <button
                    class="button is-rounded is-primary-light filter-btn"
                    data-filter="{{ val }}"
                    data-group="0"
                    aria-pressed="false">
                    {{ label }}
                </button>
            {% endfor %}
        {% endif %}

    </div>
</div>

<script>
(function() {
    const mainContainer = document.getElementById('filter-system-{{ identifier }}');
    const state = {};

    // 4.1.2 / 1.4.1 : l'état « sélectionné » est exposé par aria-pressed (pas seulement par la couleur)
    function setPressed(btn, pressed) {
        btn.setAttribute('aria-pressed', pressed ? 'true' : 'false');
        btn.classList.toggle('is-primary', pressed);
        btn.classList.toggle('is-primary-light', !pressed);
    }

    mainContainer.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const value = this.dataset.filter;
            const group = this.dataset.group;

            if (group === "all") {
                Object.keys(state).forEach(k => state[k] = []);

                mainContainer.querySelectorAll('.filter-btn').forEach(b => setPressed(b, false));
                setPressed(this, true);
            } else {
                if (!state[group]) state[group] = [];

                if (state[group].includes(value)) {
                    state[group] = state[group].filter(v => v !== value);
                    setPressed(this, false);
                } else {
                    state[group].push(value);
                    setPressed(this, true);
                }

                setPressed(mainContainer.querySelector('[data-group="all"]'), false);
            }

            document.dispatchEvent(new CustomEvent('filterChanged', {
                detail: { state: state, identifier: '{{ identifier }}' }
            }));
        });
    });
})();
</script>
