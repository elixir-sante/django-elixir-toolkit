<div class="table-container" {% if orderable %}data-orderable="true"{% endif %}{% if filterable %} data-filterable="true"{% if filter_id %} data-filter-id="{{ filter_id }}"{% endif %}{% if filter_columns %} data-filter-columns="{{ filter_columns }}"{% endif %}{% if filter_target %} data-filter-target="{{ filter_target }}"{% endif %}{% endif %}>
    <table class="table is-fullwidth is-hoverable {{ css_classes }}" {{ attrs }}{% if table_id %} id="{{ table_id }}"{% endif %}>
        {{ table_content }}
    </table>
</div>

{% if expandable %}
<script>
    // 4.1.2 : état du bouton d'expansion exposé (aria-expanded / aria-controls)
    function initToggleRowBtns() {
        document.querySelectorAll('.toggle-row-btn[data-target]').forEach(function(btn) {
            btn.setAttribute('aria-controls', btn.dataset.target);
            if (!btn.hasAttribute('aria-expanded')) {
                btn.setAttribute('aria-expanded', 'false');
            }
        });
    }

    document.addEventListener('click', function(event) {
        var btn = event.target.closest('.toggle-row-btn');
        if (!btn) return;

        // On récupère l'ID cible stocké dans data-target (ex: "details-row-6")
        var targetId = btn.dataset.target;
        if (!targetId) return;

        var targetRow = document.getElementById(targetId);
        var icon = btn.querySelector('.fa-solid');

        if (targetRow) {
            var isHidden = targetRow.style.display === 'none';
            targetRow.style.display = isHidden ? '' : 'none';
            btn.setAttribute('aria-expanded', isHidden ? 'true' : 'false');

            if (icon) {
                icon.setAttribute('aria-hidden', 'true');
                icon.classList.toggle('fa-chevron-down', isHidden);
                icon.classList.toggle('fa-chevron-right', !isHidden);
            }
        }
    });

    document.addEventListener('DOMContentLoaded', initToggleRowBtns);
    document.addEventListener('htmx:afterSettle', initToggleRowBtns);
</script>
{% endif %}
