[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-elixir-toolkit"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.3",
    "django-crispy-forms>=2.0",
    "python-dateutil>=2.8",
    "django-ckeditor-5>=0.2.20",
    "httpx>=0.27",
    "crispy-bulma @ git+https://github.com/elixir-sante/crispy-bulma.git@main"
]

[tool.setuptools.packages.find]
include = ["elixir_toolkit*"] # On n'inclut que le dossier du toolkit

[tool.setuptools_scm]
# La version est dérivée du tag git le plus proche (ex. v0.28.7)
fallback_version = "0.0.0"
